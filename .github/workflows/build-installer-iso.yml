name: Build installer ISO

on:
  push:
    branches:
      - flakes
  pull_request:
    branches:
      - flakes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NIX_CONFIG: experimental-features = nix-command flakes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build installer ISO
        run: nix build .#packages.x86_64-linux.installer-iso --print-build-logs --out-link result

      - name: Collect ISO artifact
        run: |
          mkdir -p dist
          find -L result -type f -name '*.iso' -exec cp '{}' dist/ \;
          test -n "$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)"

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: installer-iso
          path: dist/*.iso
          if-no-files-found: error
